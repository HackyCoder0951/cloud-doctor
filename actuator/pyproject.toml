[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-doctor-actuator"
version = "0.1.0"
description = "Cloud Doctor actuator: separate minimal process that verifies signed plans and runs fixed-argv sandbox commands."
requires-python = ">=3.12"
# Standard library only at runtime; the `invariants` package (also standard library only) is installed alongside.
dependencies = []

[project.optional-dependencies]
# Needed only if CD_CATALOG_PATH points at a .yaml catalogue (the default infra/catalog/services.yaml).
yaml = ["PyYAML==6.0.3"]
dev = ["pytest==9.2.0"]
# Tests that validate payloads against contracts/schemas are skipped without these.
contract = ["jsonschema==4.26.0", "referencing==0.37.0", "PyYAML==6.0.3"]

[project.scripts]
cloud-doctor-actuator = "actuator.__main__:main"

[tool.setuptools]
packages = ["actuator"]
