<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloud Doctor Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Conventions: docs/dev/conventions.md. Tokens are --group-name by role; classes are block__element--modifier;
   state and tone live in data attributes (data-tone, data-state, data-checked); no inline styles.
   Layout: sidebar | (top bar, then workspace = incident column + Incident Commander panel). Dark navy first, light theme too. */
:root {
  --surface-page:#070b14; --surface-chrome:#0a101c; --surface-panel:#0d1424; --surface-raised:#131c31;
  --border-subtle:#1b2640; --border-strong:#2a3858;
  --text-primary:#e8edf7; --text-muted:#93a1ba; --text-faint:#5c6b86;
  --accent:#7f8fff; --accent-surface:#1a2150; --accent-contrast:#070b14;
  --status-ok:#3ddc97; --status-ok-surface:#0f2a24; --status-warn:#f5b942; --status-warn-surface:#2c2410;
  --status-bad:#ff6b6b; --status-bad-surface:#2e1519; --status-unknown:#9aa7bd; --status-unknown-surface:#1c2538;
  --shadow-popover:0 10px 32px rgba(0,0,0,.45); --shadow-alert:0 0 28px rgba(255,107,107,.16);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --font-body:'Onest','Segoe UI',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --radius-panel:12px; --radius-control:8px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --surface-page:#eef2f8; --surface-chrome:#ffffff; --surface-panel:#ffffff; --surface-raised:#f1f4fa;
  --border-subtle:#d6deec; --border-strong:#bfcbe0; --text-primary:#121a2b; --text-muted:#52607a; --text-faint:#8493ad;
  --accent:#3f51d1; --accent-surface:#e5e8fb; --accent-contrast:#ffffff;
  --status-ok:#12803f; --status-ok-surface:#dff4e7; --status-warn:#8a5a00; --status-warn-surface:#fff0cc;
  --status-bad:#b42318; --status-bad-surface:#fde4e1; --status-unknown:#4a5870; --status-unknown-surface:#e8edf5;
  --shadow-popover:0 10px 28px rgba(30,50,90,.16); --shadow-alert:0 0 0 transparent; color-scheme:light;}}
:root[data-theme="light"]{
  --surface-page:#eef2f8; --surface-chrome:#ffffff; --surface-panel:#ffffff; --surface-raised:#f1f4fa;
  --border-subtle:#d6deec; --border-strong:#bfcbe0; --text-primary:#121a2b; --text-muted:#52607a; --text-faint:#8493ad;
  --accent:#3f51d1; --accent-surface:#e5e8fb; --accent-contrast:#ffffff;
  --status-ok:#12803f; --status-ok-surface:#dff4e7; --status-warn:#8a5a00; --status-warn-surface:#fff0cc;
  --status-bad:#b42318; --status-bad-surface:#fde4e1; --status-unknown:#4a5870; --status-unknown-surface:#e8edf5;
  --shadow-popover:0 10px 28px rgba(30,50,90,.16); --shadow-alert:0 0 0 transparent; color-scheme:light;}

*{box-sizing:border-box}
body{background:var(--surface-page);color:var(--text-primary);font:13.5px/1.5 var(--font-body);padding-inline:env(safe-area-inset-left,0px) env(safe-area-inset-right,0px);padding-block:0}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:25px;line-height:1.15}h2{font-size:15px}h3{font-size:13.5px;font-family:var(--font-body);font-weight:600}
p{margin:0}ul,ol,dl{margin:0}a{color:var(--accent)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.icon{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* primitives */
.container{max-width:1360px;margin:0 auto}
.stack{display:grid;gap:var(--space-3)}.stack--tight{gap:var(--space-2)}
.cluster{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}.cluster--between{justify-content:space-between}.cluster--nowrap{flex-wrap:nowrap}
.scroll-x{overflow-x:auto}
.text-muted{color:var(--text-muted)}.text-faint{color:var(--text-faint)}.text-mono{font-family:var(--font-mono);font-size:12px}.text-small{font-size:12px}
.grid{display:grid;gap:var(--space-4)}.grid--cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.grid--halves{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.page{padding:20px 20px 64px;max-width:1360px}
.page-header{display:flex;gap:var(--space-4);align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.page-header__lead{margin-top:var(--space-1);color:var(--text-muted);max-width:68ch}
.section-gap{margin-bottom:var(--space-5)}.list-plain{padding-left:18px}
.prototype-note{font-size:12px;color:var(--text-muted);padding-top:10px}

/* app shell */
.app-shell{display:grid;grid-template-columns:196px minmax(0,1fr);min-height:100vh}
.app-main{min-width:0}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--surface-chrome);border-right:1px solid var(--border-subtle);padding:14px 10px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand__mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent),var(--status-ok));color:var(--accent-contrast);font-size:18px}
.brand__name{font:700 15px/1.1 var(--font-display);display:block}.brand__tagline{font-size:10.5px;color:var(--text-muted);line-height:1.25;display:block;margin-top:2px}
.sidebar__nav{display:grid;gap:2px}
.sidebar__item{display:flex;gap:11px;align-items:center;width:100%;background:none;border:0;padding:9px 10px;border-radius:9px;color:var(--text-muted);cursor:pointer;text-align:left;font-weight:500}
.sidebar__item:hover{background:var(--surface-raised);color:var(--text-primary)}
.sidebar__item[aria-current="page"]{background:var(--accent-surface);color:var(--text-primary)}
.sidebar__item[aria-current="page"] .icon:first-child{color:var(--accent)}
.sidebar__label{flex:1}.sidebar__badge{background:var(--status-bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:600}
.sidebar__status{margin-top:auto;padding:12px 10px 4px;font-size:12px;border-top:1px solid var(--border-subtle)}
.sidebar__status-line{display:flex;gap:8px;align-items:center;font-weight:600}
.status-dot{width:9px;height:9px;border-radius:50%;background:var(--status-ok);flex:none}
.status-dot[data-tone="bad"]{background:var(--status-bad)}.status-dot[data-tone="warn"]{background:var(--status-warn)}
@media (max-width:860px){
  .app-shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px;gap:8px;border-right:0;border-bottom:1px solid var(--border-subtle)}
  .brand{padding:0 8px 0 4px}.brand__tagline,.sidebar__status{display:none}.sidebar__nav{display:flex}.sidebar__item{white-space:nowrap;padding:8px 10px;width:auto}
}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface-chrome);border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px}
.topbar__label{color:var(--text-muted)}.topbar__spacer{flex:1}
.chip{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface-panel);font-size:13px;cursor:pointer;white-space:nowrap}
.chip--static{cursor:default}.chip--live{border-color:transparent;background:var(--status-ok-surface);color:var(--status-ok);font-weight:600}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--status-ok);animation:live-pulse 2s infinite}
@keyframes live-pulse{0%{box-shadow:0 0 0 0 var(--status-ok)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}*{transition:none!important}}
.search{display:flex;gap:9px;align-items:center;flex:1 1 260px;max-width:460px;border:1px solid var(--border-strong);background:var(--surface-panel);border-radius:9px;padding:0 12px}
.search__input{flex:1;min-width:0;background:none;border:0;padding:8px 0;outline:0}.search:focus-within{border-color:var(--accent)}
.search__hint{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);border:1px solid var(--border-subtle);border-radius:5px;padding:0 6px}
.icon-button{position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface-panel);cursor:pointer}
.icon-button__count{position:absolute;top:-5px;right:-5px;background:var(--status-bad);color:#fff;border-radius:99px;font-size:10.5px;font-weight:700;min-width:17px;height:17px;display:grid;place-items:center}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-surface);color:var(--accent);font-weight:700;font-size:11px;display:grid;place-items:center;border:1px solid var(--accent)}
.popover-anchor{position:relative}
.popover{position:absolute;right:0;top:46px;width:min(340px,92vw);background:var(--surface-panel);border:1px solid var(--border-strong);border-radius:var(--radius-panel);box-shadow:var(--shadow-popover);padding:10px;z-index:30}
.popover--narrow{width:200px}
.popover__option{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:var(--radius-control);cursor:pointer;align-items:flex-start}
.popover__option:hover,.popover__option[aria-checked="true"]{background:var(--surface-raised)}
.popover__hint{display:block;color:var(--text-muted)}.popover__divider{border:0;border-top:1px solid var(--border-subtle);margin:8px 0}.popover__title{padding:4px 8px;color:var(--text-muted)}
.mode-banner{background:var(--status-warn-surface);color:var(--status-warn);font-size:12.5px;padding:7px 20px}
.mode-banner__inner{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* pill, tag, buttons */
.pill{display:inline-flex;align-items:center;gap:6px;padding:1px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent;color:var(--status-unknown);background:var(--status-unknown-surface)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill--plain::before{display:none}
.pill[data-tone="ok"]{color:var(--status-ok);background:var(--status-ok-surface)}
.pill[data-tone="warn"]{color:var(--status-warn);background:var(--status-warn-surface)}.pill[data-tone="warn"]::before{border-radius:1px;transform:rotate(45deg)}
.pill[data-tone="bad"]{color:var(--status-bad);background:var(--status-bad-surface)}.pill[data-tone="bad"]::before{border-radius:2px}
.pill[data-tone="unknown"]{border:1px dashed var(--status-unknown)}.pill[data-tone="unknown"]::before{background:none;border:1.5px dashed currentColor}
.pill[data-tone="accent"]{color:var(--accent);background:var(--accent-surface)}
.tag{font-family:var(--font-mono);font-size:11px;padding:1px 7px;border-radius:5px;background:var(--surface-raised);color:var(--text-muted);border:1px solid var(--border-subtle);white-space:nowrap}
.tag[data-tone="ok"]{color:var(--status-ok);background:var(--status-ok-surface);border-color:transparent}.tag[data-tone="warn"]{color:var(--status-warn);background:var(--status-warn-surface);border-color:transparent}
.tag[data-tone="bad"]{color:var(--status-bad);background:var(--status-bad-surface);border-color:transparent}.tag[data-tone="accent"]{color:var(--accent);background:var(--accent-surface);border-color:transparent}
.button{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--border-strong);background:var(--surface-raised);padding:7px 14px;border-radius:var(--radius-control);cursor:pointer;font-weight:600;white-space:nowrap}
.button--primary{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}
.button--outline{background:transparent;border-color:var(--accent);color:var(--accent)}
.button--danger{color:var(--status-bad);border-color:var(--status-bad);background:none}
.button:disabled{opacity:.45;cursor:not-allowed}
.link-button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:12px}
.lock-hint{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--text-muted);background:var(--surface-raised);padding:8px 10px;border-radius:var(--radius-control);border:1px dashed var(--border-strong)}
.textarea{width:100%;background:var(--surface-page);border:1px solid var(--border-strong);border-radius:var(--radius-control);padding:8px 10px;resize:vertical;min-height:62px}
.notice{border-left:3px solid var(--accent);background:var(--accent-surface);padding:9px 12px;border-radius:0 var(--radius-control) var(--radius-control) 0;font-size:12.5px}
.command-line{font-family:var(--font-mono);font-size:12px;background:var(--surface-page);border:1px solid var(--border-subtle);padding:8px 10px;border-radius:var(--radius-control)}

/* panel */
.panel{background:var(--surface-panel);border:1px solid var(--border-subtle);border-radius:var(--radius-panel);min-width:0}
.panel__header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border-subtle);flex-wrap:wrap}
.panel__title{display:flex;gap:9px;align-items:center;font:600 14.5px var(--font-body)}.panel__title .icon{color:var(--text-muted)}
.panel__body{padding:14px 16px}
.scroll-target{scroll-margin-top:84px}

/* workspace and incident banner */
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;padding:16px 20px 56px;align-items:start}
@media (max-width:1240px){.workspace{grid-template-columns:minmax(0,1fr)}}
.workspace__main{display:grid;gap:16px;min-width:0}
.row-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px}.row-triple{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1000px){.row-triple{grid-template-columns:repeat(2,minmax(0,1fr))}.row-triple>:first-child{grid-column:1/-1}}
@media (min-width:1560px){.row-triple{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr)}.row-triple>:first-child{grid-column:auto}}
@media (max-width:900px){.row-split{grid-template-columns:minmax(0,1fr)}}
.incident-banner{border:1px solid var(--status-bad);background:linear-gradient(var(--status-bad-surface),var(--surface-panel) 70%);border-radius:var(--radius-panel);box-shadow:var(--shadow-alert);padding:16px 18px;min-width:0}
.incident-banner[data-state="calm"]{border-color:var(--border-subtle);background:var(--surface-panel);box-shadow:none}
.incident-banner[data-state="closed"]{border-color:var(--status-ok);background:linear-gradient(var(--status-ok-surface),var(--surface-panel) 70%);box-shadow:none}
.incident-banner__eyebrow{display:flex;gap:10px;align-items:center;color:var(--status-bad);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;flex-wrap:wrap}
.incident-banner[data-state="closed"] .incident-banner__eyebrow{color:var(--status-ok)}
.incident-banner__id{color:var(--text-primary);font-weight:600;letter-spacing:0;text-transform:none}
.incident-banner__title{font:700 25px/1.2 var(--font-display);margin:2px 0 10px}
.incident-banner__actions{display:flex;gap:8px;flex-wrap:wrap}
.incident-banner__meta{display:flex;gap:12px 18px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--text-muted);margin-bottom:8px}
.service-chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--border-strong);border-radius:99px;padding:0 9px;font-size:12px;color:var(--text-primary);background:var(--surface-raised);cursor:pointer}
.service-chip__dot{width:7px;height:7px;border-radius:50%;background:var(--status-unknown)}
.service-chip[data-tone="bad"] .service-chip__dot{background:var(--status-bad)}.service-chip[data-tone="warn"] .service-chip__dot{background:var(--status-warn)}.service-chip[data-tone="ok"] .service-chip__dot{background:var(--status-ok)}
.severity-tag{font-weight:700;color:var(--status-bad);background:var(--status-bad-surface);border:1px solid var(--status-bad);border-radius:6px;padding:1px 9px;font-size:12px}
.pipeline{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));list-style:none;margin:14px 0 0;padding:0}
.pipeline__step{position:relative;padding-top:24px;text-align:center;font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em}
.pipeline__step::before{content:"";position:absolute;top:8px;left:-50%;right:50%;height:2px;background:var(--border-strong)}
.pipeline__step:first-child::before{display:none}
.pipeline__step::after{content:"";position:absolute;top:2px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--surface-page);border:2px solid var(--border-strong)}
.pipeline__step[data-state="done"]{color:var(--text-muted)}.pipeline__step[data-state="done"]::before{background:var(--status-ok)}.pipeline__step[data-state="done"]::after{background:var(--status-ok);border-color:var(--status-ok)}
.pipeline__step[data-state="current"]{color:var(--text-primary);font-weight:700}.pipeline__step[data-state="current"]::before{background:var(--status-ok)}.pipeline__step[data-state="current"]::after{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px var(--accent-surface)}
.pipeline__time{display:block;font-family:var(--font-mono);font-size:10px;text-transform:none;letter-spacing:0;color:var(--text-muted);margin-top:2px}
@media (max-width:900px){.pipeline{grid-template-columns:repeat(11,64px);overflow-x:auto;padding-bottom:6px}}

/* kpi */
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.kpi-card{padding:12px 14px;display:grid;gap:2px}
.kpi-card__label{color:var(--text-muted);font-size:12px;font-weight:500;display:flex;gap:6px;align-items:center}
.kpi-card__value{font:700 26px/1.15 var(--font-display);font-variant-numeric:tabular-nums}
.kpi-card[data-tone="bad"] .kpi-card__value{color:var(--status-bad)}.kpi-card[data-tone="warn"] .kpi-card__value{color:var(--status-warn)}.kpi-card[data-tone="ok"] .kpi-card__value{color:var(--status-ok)}
.kpi-card__delta{font-size:11.5px;font-weight:600;display:flex;gap:4px;align-items:center;color:var(--text-muted)}
.kpi-card__delta[data-tone="bad"]{color:var(--status-bad)}.kpi-card__delta[data-tone="ok"]{color:var(--status-ok)}.kpi-card__delta[data-tone="warn"]{color:var(--status-warn)}
.kpi-card .sparkline{height:30px;margin-top:4px}
.sparkline{display:block;width:100%;height:34px;margin-top:10px}
.sparkline__area{opacity:.14;fill:var(--status-unknown)}.sparkline__line{fill:none;stroke:var(--status-unknown);stroke-width:1.8}.sparkline__end{fill:var(--status-unknown)}
.sparkline[data-tone="ok"] .sparkline__area,.sparkline[data-tone="ok"] .sparkline__end{fill:var(--status-ok)}.sparkline[data-tone="ok"] .sparkline__line{stroke:var(--status-ok)}
.sparkline[data-tone="warn"] .sparkline__area,.sparkline[data-tone="warn"] .sparkline__end{fill:var(--status-warn)}.sparkline[data-tone="warn"] .sparkline__line{stroke:var(--status-warn)}
.sparkline[data-tone="bad"] .sparkline__area,.sparkline[data-tone="bad"] .sparkline__end{fill:var(--status-bad)}.sparkline[data-tone="bad"] .sparkline__line{stroke:var(--status-bad)}

/* timeline */
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.timeline__item{display:grid;grid-template-columns:18px 64px minmax(0,1fr);gap:8px;align-items:baseline;padding:3px 0}
.timeline__marker{width:9px;height:9px;border-radius:50%;background:var(--border-strong);justify-self:center;align-self:center}
.timeline__marker[data-kind="alert"]{background:var(--status-bad)}.timeline__marker[data-kind="diagnosis"]{background:var(--accent)}
.timeline__marker[data-kind="resolved"]{background:var(--status-ok)}.timeline__marker[data-kind="action"]{background:var(--status-warn)}
.timeline__time{color:var(--text-muted);font-family:var(--font-mono);font-size:12px}

/* topology */
.topology{width:100%;height:auto;display:block}
.topology__label{fill:var(--text-primary);font:600 13px var(--font-body)}.topology__state{font:11px var(--font-body);fill:var(--status-unknown)}.topology__detail{fill:var(--text-muted);font:11px var(--font-body)}
.topology__edge{stroke:var(--border-strong);stroke-width:1.5;fill:none}.topology__edge--failing{stroke:var(--status-bad);stroke-dasharray:4 4}
.topology__arrow{fill:var(--text-faint)}
.topology__node{cursor:pointer}.topology__node rect{fill:var(--surface-raised);stroke:var(--status-unknown);stroke-width:2}.topology__node:hover rect{fill:var(--accent-surface)}
.topology__dot{fill:var(--status-unknown)}
.topology__node[data-tone="ok"] rect{stroke:var(--status-ok)}.topology__node[data-tone="ok"] .topology__dot{fill:var(--status-ok)}.topology__node[data-tone="ok"] .topology__state{fill:var(--status-ok)}
.topology__node[data-tone="warn"] rect{stroke:var(--status-warn)}.topology__node[data-tone="warn"] .topology__dot{fill:var(--status-warn)}.topology__node[data-tone="warn"] .topology__state{fill:var(--status-warn)}

function renderSparkline(trend, tone) {

  const path = points.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = points[points.length - 1];

}

      <span class="tag" data-tone="${{low:'ok',medium:'warn',high:'bad'}[o.risk]}">${o.risk.toUpperCase()}</span><span class="policy-result" data-policy="${o.policy}">${icon(policyText[o.policy][1])}${policyText[o.policy][0]}</span></button>`).join('')}</div>
    ${confirmBox}
    <div class="remediation-footer"><div class="remediation-footer__facts"><span>Requires: <b>Human approval</b></span><span>Policy: Layer 1 (inv-0.1) · Layer 2 off</span><span>Rollback: ${chosen.rollback}</span>${chosen.command ? `<span class="text-mono">${escapeHtml(chosen.command)}${chosen.expires_in !== '—' ? ' · expires ' + chosen.expires_in : ''}</span>` : ''}</div>
      <div class="stack stack--tight">${resolution ? pill('ok', escapeHtml(resolution))
        : can('decide_plans') ? `<div class="cluster"><button class="button button--primary" data-action="start-decision" data-decision="approve" ${runnable ? '' : 'disabled'}>${icon('play')}Approve &amp; Execute</button><button class="button button--danger" data-action="start-decision" data-decision="reject" ${chosen.policy === 'allowed' ? '' : 'disabled'}>Reject</button></div>`
        : lockHint('decide_plans', 'Only approvers and admins can approve or reject plans.')}
        ${!resolution && can('decide_plans') && !runnable ? `<span class="text-small">${chosen.policy === 'denied' ? 'Policy denies this action.' : 'Not in the action catalogue yet.'}</span>` : ''}</div></div></div></section>`;
}
function renderVerificationPanel(incident) {
  const resolution = ui.decisions[incident.incident_id];
  const header = incident.state === 'closed' ? ['ok', 'Passed'] : resolution && resolution.startsWith('Approved') ? ['ok', 'Ready to verify'] : ['unknown', 'Waiting for an action'];
  return `<section class="panel"><div class="panel__header">${panelTitle('shield', 'Recovery Verification')}${pill(header[0], header[1])}</div>
  <div class="panel__body stack"><ul class="check-list">${incident.verification_criteria.map(c => `<li class="check-list__item" data-result="${c.passed === true ? 'pass' : c.passed === false ? 'fail' : 'pending'}"><span class="check-list__mark">${c.passed === true ? icon('check') : ''}</span><span>${c.label}</span><span class="check-list__value">${c.value}</span></li>`).join('')}</ul>
  ${incident.state === 'closed' ? '' : '<p class="text-muted text-small">Checks run after an action completes. The values shown are current readings, not results.</p>'}</div></section>`;
}
function renderReportPanel(incident) {
  const r = incident.report;
  return `<section class="panel scroll-target" id="section-report"><div class="panel__header">${panelTitle('file', 'Post-Incident / Report')}${pill('accent', r.status, 'pill--plain')}</div>
  <div class="panel__body stack"><dl class="stack stack--tight">${[['Timeline:', r.window], ['Root cause:', r.root_cause], ['Impact:', r.impact], ['Recovery:', r.recovery]].map(([t, v]) => `<div class="report-line"><dt>${t}</dt><dd>${escapeHtml(v)}</dd></div>`).join('')}</dl>
  <div class="cluster cluster--between"><h3>Follow-up actions (${r.follow_ups.length})</h3><button class="link-button" data-action="copy-report">Copy as Markdown</button></div>
  <ul class="followups">${r.follow_ups.map(f => `<li class="followups__item"><span class="followups__box"></span><span>${escapeHtml(f.text)}</span><span class="tag" data-tone="${{P0:'bad',P1:'warn',P2:'accent'}[f.priority]}">${f.priority}</span></li>`).join('')}</ul></div></section>`;
}
function renderCommander(incident) {
  const tab = ui.commanderTab, recent = auditEvents.filter(a => a.incident_id === incident.incident_id).slice(0, tab === 'activity' ? 8 : 3);
  const sections = {
    summary: `<section class="panel commander-section"><h3>${icon('file')}Incident Summary</h3><p class="text-muted text-small">${escapeHtml(incident.summary)}</p>
      <div class="segment"><div class="segment__cell" data-tone="bad">Severity<b>${severityLabel[incident.severity].split(' · ')[0]}</b></div><div class="segment__cell">Classification<b>${incident.classification}</b></div><div class="segment__cell" data-tone="accent">State<b>${stateLabel[incident.state]}</b></div></div></section>`,
    impact: `<section class="panel commander-section"><h3>${icon('gear')}Impact</h3><ul class="list-plain text-small">${incident.impact.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul></section>`,
    state: `<section class="panel commander-section"><h3>${icon('search')}Investigation State</h3><ul class="state-list">${incident.investigation_state.map(s => `<li class="state-list__item" data-state="${s.state}"><span class="state-list__mark"></span><span>${s.label}</span><span class="state-list__value">${s.value}</span></li>`).join('')}</ul></section>`,
    next: `<section class="next-step"><span class="next-step__title">${icon('bolt')}Next Recommended Step</span><span>${escapeHtml(incident.next_step.text)}</span><span class="text-muted">${incident.next_step.meta}</span></section>`,
    audit: `<section class="panel commander-section"><div class="cluster cluster--between"><h3>${icon('clipboard')}Recent Actions (Audit)</h3><button class="link-button" data-action="open-view" data-view="audit">View all →</button></div>
      <ul class="audit-list">${recent.map(a => `<li class="audit-list__item"><span class="audit-list__time">${a.time}</span><span>${a.event_type}</span></li>`).join('') || '<li class="text-muted">No audit events yet.</li>'}</ul></section>`};
  const byTab = {summary:['summary','impact','state','next','audit'], investigation:['state','next'], actions:['next','audit'], activity:['audit']};
  return `<aside class="commander" id="commander"><div class="commander__header"><span class="commander__title">${icon('signal')}Incident Commander</span>${pill('accent', 'Rule-based', 'pill--plain')}</div>
    <div class="tabs" role="tablist">${['summary','investigation','actions','activity'].map(t => `<button class="tabs__tab" role="tab" data-action="select-commander-tab" data-commander-tab="${t}" aria-selected="${tab === t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div>
    ${byTab[tab].map(k => sections[k]).join('')}</aside>`;
}
function renderCommandCenter(incident) {
  if (!incident) return `<div class="page"><section class="incident-banner" data-state="calm"><h1>All clear</h1><p class="text-muted">No open incidents. Cloud Doctor is watching ${services.length} services.</p></section></div>`;
  return `<div class="workspace"><div class="workspace__main">${ui.view === 'incident' ? `<a href="#" data-action="open-view" data-view="incidents">${icon('back')} All incidents</a>` : ''}
    ${renderIncidentBanner(incident)}${renderKpiStrip(incident)}<div class="row-split">${renderTimelinePanel(incident)}${renderTopologyPanel()}</div>${renderEvidencePanel(incident)}
    <div class="row-triple">${renderRemediationPanel(incident)}${renderVerificationPanel(incident)}${renderReportPanel(incident)}</div></div>${renderCommander(incident)}</div>`;
}

/* ---------- other pages ---------- */
const renderObservability = () => `<div class="page"><div class="page-header"><div><h1>Observability</h1><p class="page-header__lead">Health, latency and load for every service.</p></div><span class="tag">sample data</span></div>
  <div class="grid grid--cards">${services.map(s => `<button class="panel service-card" data-tone="${healthTone[s.health_state]}" data-action="open-service" data-service-name="${s.name}"><div class="cluster cluster--between"><span class="service-card__name">${s.name}</span>${healthPill(s.health_state)}</div><div class="text-muted">${s.kind.replace('_', ' ')}</div>
    <div class="stack stack--tight">${factsList([['Availability', s.availability], ['Latency', s.latency], ['Load', s.load]], true)}</div>${renderSparkline(s.trend, healthTone[s.health_state])}</button>`).join('')}</div></div>`;
function renderTopologyPage() {
  const node = serviceByName(ui.nodeName);
  return `<div class="page"><div class="page-header"><div><h1>Topology</h1><p class="page-header__lead">Who depends on whom. A dashed red line is a dependency that is failing right now.</p></div></div>
  <div class="layout-split"><section class="panel panel__body">${renderTopologySvg(true)}</section>
  <aside class="panel panel__body stack"><div class="cluster cluster--between"><h2>${node.name}</h2>${healthPill(node.health_state)}</div><span class="text-muted">${node.kind.replace('_', ' ')}</span>
    ${factsList([['Availability', node.availability],['Latency', node.latency],['Load', node.load],['Depends on', node.depends_on.join(', ') || 'nothing'],['Used by', services.filter(s => s.depends_on.includes(node.name)).map(s => s.name).join(', ') || 'nothing']])}
    ${renderSparkline(node.trend, healthTone[node.health_state])}${node.incident_id ? `<button class="button button--primary" data-action="open-incident" data-incident-id="${node.incident_id}">Open ${node.incident_id}</button>` : '<span class="text-muted">No open incident.</span>'}</aside></div></div>`;
}
function renderIncidentList() {
  const filtered = Object.values(incidents).filter(i => ui.filter === 'all' || (ui.filter === 'open' ? i.state !== 'closed' : i.state === 'closed'));
  return `<div class="page"><div class="page-header"><div><h1>Incidents</h1><p class="page-header__lead">One row per problem. Related failures are grouped, so one cause is one incident.</p></div>
  <div class="filter-group" role="group" aria-label="filter">${[['all','All'],['open','Open'],['closed','Closed']].map(([id, label]) => `<button class="filter-group__option" data-action="set-filter" data-filter="${id}" aria-pressed="${ui.filter === id}">${label}</button>`).join('')}</div></div>
  <section class="panel"><div class="incident-row incident-row--head"><span>ID</span><span>Problem</span><span>Status</span><span>Likely cause</span><span>Opened</span></div>
  ${filtered.map(i => `<button class="incident-row" data-action="open-incident" data-incident-id="${i.incident_id}"><span class="text-mono">${i.incident_id}</span><span><b>${escapeHtml(i.title)}</b><br><span class="text-muted">${i.services.join(' · ')}</span></span><span>${incidentStatePill(i.state)}</span><span class="text-mono text-muted">${i.top_cause.cause_id}<br>ranking ${i.top_cause.ranking.toFixed(2)}</span><span class="text-muted">${i.opened_at}<br>${i.age}</span></button>`).join('')}</section>
  <p class="prototype-note">Design note: INC-0003 covers api, worker and app-db as one incident. The running backend currently opens one per dependent; this is the target behaviour.</p></div>`;
}
const renderAccessDenied = (title, who) => `<div class="page"><div class="page-header"><h1>${title}</h1></div><div class="panel panel__body stack"><h2>You don't have access</h2><p class="text-muted">${who} Ask an admin for the role, or switch role from the avatar menu (prototype only).</p></div></div>`;
function renderAudit() {
  if (!can('view_audit')) return renderAccessDenied('Audit log', 'Admins only.');
  return `<div class="page"><div class="page-header"><div><h1>Audit log</h1><p class="page-header__lead">Every detection, decision and action, chained by hash so tampering is visible.</p></div><div class="cluster">${pill('ok', 'chain valid')}<span class="text-muted">${auditEvents.length} events</span></div></div>
  <section class="panel scroll-x"><table class="matrix matrix--wide"><thead><tr><th>Time</th><th>Actor</th><th>Event</th><th>Incident</th><th>Hash</th></tr></thead><tbody>${auditEvents.map(a => `<tr><td class="text-mono">${a.time}</td><td>${a.actor}</td><td>${a.event_type}</td><td class="text-mono">${a.incident_id}</td><td class="text-mono text-muted">${a.hash}</td></tr>`).join('')}</tbody></table></section></div>`;
}
function renderAccess() {
  if (!can('manage_access')) return renderAccessDenied('Access', 'Only admins manage roles.');
  const current = effectiveRoleId();
  return `<div class="page"><div class="page-header"><div><h1>Access</h1><p class="page-header__lead">Roles decide what each person can see and do. Locked controls always say why.</p></div></div>
  <section class="panel scroll-x section-gap"><table class="matrix"><thead><tr><th>Permission</th>${Object.entries(roles).map(([id, r]) => `<th data-current="${id === current}">${r.label}</th>`).join('')}</tr></thead>
  <tbody>${permissionLabels.map(([permission, label]) => `<tr><td>${label}</td>${Object.entries(roles).map(([id, r]) => `<td data-current="${id === current}">${r.permissions.includes(permission) ? '<span class="matrix__yes">✓</span>' : '<span class="matrix__no">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></section>
  <div class="grid grid--halves"><section class="panel panel__body stack"><h2>Environment access mode</h2><p class="text-muted">Set by the deployment, not by users.</p>
    ${factsList([['rbac', 'Sign in, roles apply. Default for any real environment.'], ['open', 'No sign-in. Everyone acts as Super Admin. For testing and demos only.']])}
    <div class="cluster"><button class="button ${ui.envMode === 'rbac' ? 'button--primary' : ''}" data-action="set-env" data-env-mode="rbac">rbac</button><button class="button ${ui.envMode === 'open' ? 'button--primary' : ''}" data-action="set-env" data-env-mode="open">open (test)</button></div></section>
  <section class="panel panel__body stack"><h2>Safety rules</h2><ul class="list-plain"><li>Open mode shows a banner on every page.</li><li>Open mode is refused when the API listens on a non-local address, unless explicitly overridden.</li><li>Every decision is logged with the actor, including <span class="text-mono">open-mode</span>.</li></ul></section></div></div>`;
}

/* ---------- shell ---------- */
function renderSidebar() {
  const openCount = openIncidents().length, sectionIds = ['section-evidence','section-remediation','section-report'];
  const items = [['overview','home','Overview','open-view'],['topology','topology','Topology','open-view'],['incidents','alert','Incidents','open-view'],['observability','bars','Observability','open-view'],
    ['section-evidence','search','Investigation','open-section'],['section-remediation','bolt','Remediation','open-section'],['section-report','file','Reports','open-section'],['audit','clipboard','Audit','open-view'],['access','users','Access','open-view']];
  const locked = id => (id === 'audit' && !can('view_audit')) || (id === 'access' && !can('manage_access'));
  const current = id => sectionIds.includes(id) ? ui.sectionFocus === id : (ui.view === id || (ui.view === 'incident' && id === 'incidents' && !ui.sectionFocus));
  return `<aside class="sidebar"><div class="brand"><span class="brand__mark">${icon('pulse')}</span><span><span class="brand__name">Cloud Doctor</span><span class="brand__tagline">SRE Incident Command Center</span></span></div>
  <nav class="sidebar__nav" aria-label="Main">${items.map(([id, iconName, label, action]) => `<button class="sidebar__item" data-action="${action}" ${action === 'open-view' ? `data-view="${id}"` : `data-section="${id}"`} ${current(id) ? 'aria-current="page"' : ''}>${icon(iconName)}<span class="sidebar__label">${label}</span>${id === 'incidents' && openCount ? `<span class="sidebar__badge">${openCount}</span>` : ''}${locked(id) ? icon('lock') : ''}</button>`).join('')}</nav>
  <div class="sidebar__status"><span class="sidebar__status-line"><span class="status-dot" data-tone="${openCount ? 'warn' : 'ok'}"></span>${openCount ? 'Incidents open' : 'System healthy'}</span><span class="text-muted">Core platform operational</span><br><span class="text-faint text-small">v1.0.0 (Sandbox)</span></div></aside>`;
}
function renderTopbar() {
  const role = roles[effectiveRoleId()], open = openIncidents();
  return `<header class="topbar"><span class="topbar__label">Environment:</span><span class="chip chip--static">${icon('cube')}Sandbox</span><span class="chip chip--live chip--static"><span class="live-dot"></span>Live</span><span class="topbar__spacer"></span>
  <div class="popover-anchor"><button class="chip" data-action="toggle-popover" data-popover="range" aria-haspopup="true" aria-expanded="${ui.popover === 'range'}">${icon('calendar')}${ui.timeRange}${icon('chevron')}</button>
    ${ui.popover === 'range' ? `<div class="popover popover--narrow" role="menu">${timeRanges.map(r => `<button class="popover__option" role="menuitemradio" aria-checked="${ui.timeRange === r}" data-action="set-range" data-range="${r}">${r}</button>`).join('')}</div>` : ''}</div>
  <label class="search" for="global-search">${icon('search')}<input class="search__input" id="global-search" type="search" placeholder="Search incidents, services, evidence…" autocomplete="off"><span class="search__hint">Ctrl K</span></label>
  <div class="popover-anchor"><button class="icon-button" data-action="toggle-popover" data-popover="bell" aria-label="Notifications" aria-haspopup="true">${icon('bell')}${open.length ? `<span class="icon-button__count">${open.length}</span>` : ''}</button>
    ${ui.popover === 'bell' ? `<div class="popover" role="menu"><div class="popover__title">Open incidents</div>${open.map(i => `<button class="popover__option" data-action="open-incident" data-incident-id="${i.incident_id}"><span><b>${i.incident_id}</b> ${escapeHtml(i.title)}<span class="popover__hint">${stateLabel[i.state]} · ${severityLabel[i.severity]}</span></span></button>`).join('') || '<div class="popover__title">Nothing open.</div>'}</div>` : ''}</div>
  <button class="icon-button" data-action="toggle-theme" aria-label="Toggle theme">${icon('contrast')}</button>
  <div class="popover-anchor"><button class="chip" data-action="toggle-popover" data-popover="account" aria-haspopup="true" aria-expanded="${ui.popover === 'account'}"><span class="avatar">HC</span>${ui.envMode === 'open' ? pill('warn', 'OPEN', 'pill--plain') : `<span class="text-muted text-small">${role.label}</span>`}${icon('chevron')}</button>
  ${ui.popover === 'account' ? `<div class="popover" role="menu"><div class="popover__title">Prototype: simulate who is signed in</div>${Object.entries(roles).map(([id, r]) => `<button class="popover__option" role="menuitemradio" aria-checked="${ui.roleId === id && ui.envMode === 'rbac'}" data-action="set-role" data-role-id="${id}"><span><b>${r.label}</b><span class="popover__hint">${r.description}</span></span></button>`).join('')}<hr class="popover__divider">
    <button class="popover__option" role="menuitemradio" aria-checked="${ui.envMode === 'open'}" data-action="set-env" data-env-mode="${ui.envMode === 'open' ? 'rbac' : 'open'}"><span><b>Open test mode</b><span class="popover__hint">Environment role = open: everyone is Super Admin</span></span></button></div>` : ''}</div></header>
  ${ui.envMode === 'open' ? `<div class="mode-banner"><div class="mode-banner__inner"><b>Open test mode.</b> No sign-in; every visitor has Super Admin rights. Do not expose this environment.<a href="#" data-action="set-env" data-env-mode="rbac">Switch to role-based access</a></div></div>` : ''}`;
}
function render() {
  const views = {overview: () => renderCommandCenter(activeIncident()), incident: () => renderCommandCenter(incidents[ui.incidentId]), topology: renderTopologyPage, incidents: renderIncidentList, observability: renderObservability, audit: renderAudit, access: renderAccess};
  document.getElementById('app').innerHTML = `<div class="app-shell">${renderSidebar()}<div class="app-main">${renderTopbar()}${views[ui.view]()}</div></div>`;
  if (ui.focus) { const target = document.getElementById(ui.focus); if (target) target.scrollIntoView({block: 'start'}); ui.focus = null; }
}

/* ---------- actions: one handler per data-action value (kebab-case) ---------- */
const actions = {
  'toggle-popover': d => { ui.popover = ui.popover === d.popover ? null : d.popover; },
  'set-range': d => { ui.timeRange = d.range; ui.popover = null; showToast('Range set to ' + d.range + ' (sample data does not change)'); },
  'set-role': d => { ui.roleId = d.roleId; ui.envMode = 'rbac'; ui.popover = null; showToast('Signed in as ' + roles[d.roleId].label + ' (simulated)'); },
  'set-env': d => { ui.envMode = d.envMode; ui.popover = null; showToast(d.envMode === 'open' ? 'Open test mode on: everyone is Super Admin' : 'Role-based access restored'); },
  'toggle-theme': () => { const root = document.documentElement; root.setAttribute('data-theme', getComputedStyle(root).colorScheme.includes('dark') ? 'light' : 'dark'); },
  'open-view': d => { ui.view = d.view; ui.sectionFocus = null; ui.popover = null; window.scrollTo(0, 0); },
  'open-section': d => { if (ui.view !== 'incident') { ui.view = 'incident'; ui.incidentId = (activeIncident() || Object.values(incidents)[0]).incident_id; } ui.sectionFocus = d.section; ui.focus = d.section; ui.popover = null; },
  'open-incident': d => { ui.view = 'incident'; ui.incidentId = d.incidentId; ui.sectionFocus = null; ui.pendingDecision = null; ui.popover = null; window.scrollTo(0, 0); },
  'open-service': d => { ui.view = 'topology'; ui.nodeName = d.serviceName; ui.sectionFocus = null; window.scrollTo(0, 0); },
  'open-commander': () => { ui.focus = 'commander'; },
  'select-node': d => { ui.nodeName = d.serviceName; },
  'select-evidence-tab': d => { ui.evidenceTab = d.evidenceTab; },
  'select-commander-tab': d => { ui.commanderTab = d.commanderTab; ui.focus = 'commander'; },
  'select-option': d => { ui.selectedOptions[currentIncident().incident_id] = d.optionId; ui.pendingDecision = null; },
  'set-filter': d => { ui.filter = d.filter; },
  'show-evidence': d => { const item = currentIncident().evidence.find(e => e.evidence_id === d.evidenceId); showToast(d.evidenceId + (item ? ' · ' + item.source + ' · ' + item.summary : ' · not collected for this incident')); },
  'start-decision': d => { ui.pendingDecision = d.decision; },
  'cancel-decision': () => { ui.pendingDecision = null; },
  'submit-decision': d => {
    const id = currentIncident().incident_id, reason = (document.getElementById('decision-reason') || {}).value || '';
    ui.decisions[id] = (d.decision === 'approve' ? 'Approved' : 'Rejected') + ' by you just now' + (reason ? ': ' + reason : '');
    ui.pendingDecision = null;
    showToast('Plan ' + (d.decision === 'approve' ? 'approved. The actuator will run it and verification follows.' : 'rejected. The incident stays open.'));
  },
  'take-ownership': () => { ui.owners[currentIncident().incident_id] = 'you'; showToast('You now own ' + currentIncident().incident_id + ' (logged in the audit trail)'); },
  'copy-report': () => { try { navigator.clipboard.writeText('# ' + currentIncident().incident_id).then(() => showToast('Copied'), () => showToast('Copy blocked: select the text instead')); } catch (_) { showToast('Copy blocked: select the text instead'); } },
};
document.addEventListener('click', event => {
  const target = event.target.closest('[data-action]');
  if (!target) { if (ui.popover) { ui.popover = null; render(); } return; }
  if (target.tagName === 'A') event.preventDefault();
  actions[target.dataset.action](target.dataset);
  render();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && ui.popover) { ui.popover = null; render(); }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); const input = document.getElementById('global-search'); if (input) input.focus(); return; }
  const node = event.target.closest && event.target.closest('g[data-action]');
  if (node && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); actions[node.dataset.action](node.dataset); render(); return; }
  if (event.target.id === 'global-search' && event.key === 'Enter') {
    const query = event.target.value.trim().toLowerCase(); if (!query) return;
    const hit = Object.values(incidents).find(i => (i.incident_id + ' ' + i.title + ' ' + i.services.join(' ') + ' ' + i.top_cause.cause_id).toLowerCase().includes(query));
    if (hit) { actions['open-incident']({incidentId: hit.incident_id}); render(); return; }
    const service = services.find(s => s.name.includes(query));
    if (service) { actions['open-service']({serviceName: service.name}); render(); return; }
    showToast('No incident or service matches "' + query + '"');
  }
});
ui.incidentId = (activeIncident() || {incident_id: 'INC-0003'}).incident_id;
render();
</script>
