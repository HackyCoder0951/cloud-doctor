# Thresholds, timings and N are PROVISIONAL design values (nothing here is measured).
# ground_truth/fault/accepted_remediation are HARNESS-ONLY: never sent to the Cloud Doctor API.
schema_version: 1
id: EXP-08
status: designed
title: "Dependency outage (multi-hop)"
objective: "Test multi-hop diagnosis when a downstream dependency (app-db) is down: loadgen depends on api depends on app-db. Restarting a database is never allowed, so escalation is the expected outcome."
design_doc: docs/11-experiments/experiment-framework.md
is_control: false
targets: [app-db]
affected_services: [app-db, api, worker]
fault:
  type: container_stop
  target: app-db
  params: {}
  persistent: false
timing: {baseline_seconds: 60, baseline_timeout_seconds: 300, max_duration_seconds: 600, detection_deadline_seconds: 120, poll_seconds: 2, settle_seconds: 30}
abort: {max_unhealthy_services: 4, max_action_services: 1, max_executions: 2}
steady_state:
  - {service: api, sli: error_ratio, op: "<=", threshold: 0.01}
  - {service: api, sli: latency_p95_seconds, op: "<=", threshold: 0.5}
  - {service: worker, sli: queue_depth, op: "<=", threshold: 100}
ground_truth:
  cause_equivalence_class: [app_db_unavailable, db_unavailable]
  cause_service: app-db
  decoy_causes: []
accepted_remediation:
  outcome: escalated
  actions:
    - {action_id: escalate, service: app-db}
max_attempts: 2
recoverability:
  required_signals:
    - {id: app_db_target_down, source: metric, service: app-db, name: up, visibility: api, required: true, supports: cause, description: "app-db up=0"}
    - {id: api_error_ratio, source: metric, service: api, name: error_ratio, visibility: api, required: true, supports: cause, description: "api error ratio rises"}
    - {id: api_db_errors_logs, source: log, service: api, visibility: api, required: true, supports: cause, description: "api logs show database connection failures"}
    - {id: api_depends_on_app_db, source: topology, service: api, to: app-db, visibility: api, required: true, supports: cause, description: "dependency edge api->app-db"}
    - {id: loadgen_depends_on_api, source: topology, service: loadgen, to: api, visibility: api, required: true, supports: cause, description: "second hop loadgen->api"}
variants: {llm: ["off", "on"], log_noise: ["off", "on"]}
repetitions: 5
