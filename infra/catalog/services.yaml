# Service catalog (topology as code) — frozen contract v1, validated against
# contracts/schemas/service_catalog.json. Scrape targets, the dependency graph,
# health probes and the actuator allowlist are GENERATED from this file.
catalog_version: 1
environment: sandbox
network: cd_sandbox
sandbox_label: "cloud-doctor.sandbox=true"
services:
  - name: loadgen
    kind: load_generator
    container: cd-loadgen
    depends_on:
      - {service: api, kind: hard}
    metrics: {port: 9101, path: /metrics}
    health: {liveness: /healthz}
    allowed_actions: [escalate]

  - name: api
    kind: app
    container: cd-api
    depends_on:
      - {service: redis, kind: hard}
      - {service: app-db, kind: hard}
    metrics: {port: 8000, path: /metrics}
    health:
      liveness: /healthz
      readiness: /readyz
      published_probe_url: http://127.0.0.1:18000/work
    slo: {availability: 0.99, latency_p95_seconds: 0.5}
    allowed_actions: [restart_service, rollback_service, escalate]

  - name: worker
    kind: queue_worker
    container: cd-worker
    depends_on:
      - {service: redis, kind: hard}
      - {service: app-db, kind: hard}
    metrics: {port: 8001, path: /metrics}
    health: {liveness: /healthz, readiness: /readyz}
    slo: {availability: 0.99}
    allowed_actions: [restart_service, escalate]

  - name: redis
    kind: cache
    container: cd-redis
    depends_on: []
    metrics: {port: 9121, path: /metrics}
    health: {liveness: "tcp:6379"}
    slo: {availability: 0.99}
    allowed_actions: [restart_service, clear_cache, escalate]

  - name: app-db
    kind: database
    container: cd-app-db
    depends_on: []
    metrics: {port: 9187, path: /metrics}
    health: {liveness: "tcp:5432"}
    slo: {availability: 0.99}
    allowed_actions: [escalate]   # restarting a database is never allowed (high risk)
