server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://cd-loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: sim-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: sim
          env: sandbox
          __path__: /logs/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            ts: ts
      - labels:
          level:
          service:
      - timestamp:
          source: ts
          format: RFC3339Nano
