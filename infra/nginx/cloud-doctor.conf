# Cloud Doctor dashboard: static export + API reverse proxy (Stream D, ADR-007).
#
# Install: copy this directory to <nginx conf dir>/cloud-doctor/ and add inside http { }:
#     include cloud-doctor/cloud-doctor.conf;
# (relative include paths resolve against the nginx conf prefix, usually /etc/nginx).
# Check without nginx:  npm --prefix frontend run check:nginx     (also runs `nginx -t` if nginx exists)
#
# nginx does only three things here: serve frontend/out, proxy /api/ to the Python API, and add
# security headers. Authentication and authorization are enforced by the Python API, not here.
# TLS: terminate TLS in front of this server (or add `ssl` + certificates to `listen`); the API sets the
# session cookie with Secure, so use HTTPS outside local development.

# The Python API. Default 127.0.0.1:8080; change the next line or use `npm run nginx:render -- --upstream HOST:PORT`.
upstream cd_api {
    server 127.0.0.1:8080;   # @upstream
    keepalive 16;
}

server {
    listen 127.0.0.1:8088;   # @listen
    server_name _;
    server_tokens off;

    # Built by `npm run build` in frontend/. Change the next line or use `npm run nginx:render -- --root DIR`.
    root /srv/cloud-doctor/frontend/out;   # @root
    index index.html;
    absolute_redirect off;   # never put the internal host/port into redirects (/incidents -> /incidents/)

    # Defines $cd_script_hashes (GENERATED by the frontend build; see security-headers.inc).
    include cloud-doctor/csp-script-hashes.conf;

    # Correct media types are REQUIRED: with X-Content-Type-Options: nosniff the browser refuses scripts and
    # stylesheets served as text/plain. Standard nginx types file (resolved against the conf prefix).
    include mime.types;
    default_type application/octet-stream;

    client_max_body_size 64k;   # the API only receives tiny JSON bodies (login token, approval reason)

    # Static pages. The export uses trailing slashes (/incidents/ -> incidents/index.html); every route is a
    # real exported page and ids travel in the query string, so no catch-all rewrite to index.html is needed.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;   # HTML must revalidate: its inline-script hashes change per build
        include cloud-doctor/security-headers.inc;
    }

    # Content-hashed build output can be cached for a long time.
    location /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include cloud-doctor/security-headers.inc;
    }

    # API + server-sent events (/api/v1/stream). The URI is passed through unchanged, so the backend serves
    # /api/v1/... (the `servers` base of contracts/openapi.yaml). Buffering is off and the read timeout is
    # long so SSE frames reach the browser immediately and idle streams are not cut.
    location /api/ {
        proxy_pass http://cd_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
        include cloud-doctor/security-headers.inc;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include cloud-doctor/security-headers.inc;
    }

    # No dotfiles, source maps or lockfiles are ever served.
    location ~ /\.(?!well-known) {
        include cloud-doctor/security-headers.inc;
        return 404;
    }
    location ~* \.map$ {
        include cloud-doctor/security-headers.inc;
        return 404;
    }
}
